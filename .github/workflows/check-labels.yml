name: Check version labels

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize, reopened]

jobs:
  check-labels:
    name: Enforce semantic versioning
    runs-on: ubuntu-latest
    steps:
      - name: Check for version labels
        uses: actions/github-script@v9
        with:
          script: |
            // Mirrors release.yml's bump-detection priority: major > minor > patch > norelease.
            // A semver label is allowed to coexist with `norelease` (Dependabot always adds
            // `norelease` alongside its own semver-magnitude label), so the actual error is
            // having more than one semver label, not norelease co-occurring with one.
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const semverLabels = ['major', 'minor', 'patch'];
            const versionLabels = [...semverLabels, 'norelease'];
            const presentVersionLabels = labels.filter(l => versionLabels.includes(l));
            const presentSemverLabels = labels.filter(l => semverLabels.includes(l));

            if (presentVersionLabels.length === 0) {
              core.setFailed('PR must have at least one of: ' + versionLabels.join(', '));
            }

            if (presentSemverLabels.length > 1) {
              core.setFailed(
                'PR must have at most one semver label (major/minor/patch), found: ' +
                  presentSemverLabels.join(', '),
              );
            }
